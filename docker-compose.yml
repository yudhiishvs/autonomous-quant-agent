x-trader-environment: &trader-environment
  APA_ALPACA_PAPER_API_KEY: ${APA_ALPACA_PAPER_API_KEY:-}
  APA_ALPACA_PAPER_SECRET_KEY: ${APA_ALPACA_PAPER_SECRET_KEY:-}
  APA_ENABLE_PAPER_ORDERS: ${APA_ENABLE_PAPER_ORDERS:-NO}

x-trader-volumes: &trader-volumes
  - apa-runtime:/app/runtime
  - apa-outputs:/app/outputs
  - apa-data-cache:/app/data/cache
  - ./configs:/app/configs:ro

x-market-data-environment: &market-data-environment
  APA_ALPACA_DATA_API_KEY: ${APA_ALPACA_DATA_API_KEY:-}
  APA_ALPACA_DATA_SECRET_KEY: ${APA_ALPACA_DATA_SECRET_KEY:-}
  APA_MARKET_DATA_DATABASE_URL: ${APA_MARKET_DATA_DATABASE_URL:-}
  APA_MARKET_DATA_HISTORY_START: ${APA_MARKET_DATA_HISTORY_START:-}

services:
  market-data-collector:
    profiles: ["market-data"]
    build:
      context: .
      target: market-data
    image: adaptive-market-data:local
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m
    stop_grace_period: 60s
    restart: unless-stopped
    command: ["python", "-m", "adaptive_trader.collection", "run"]
    environment: *market-data-environment
    healthcheck:
      test: ["CMD", "python", "-m", "adaptive_trader.collection", "ready"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  trader:
    build:
      context: .
      target: application
    image: adaptive-portfolio-agent:local
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m
    stop_grace_period: 45s
    restart: unless-stopped
    command: ["python", "-m", "adaptive_trader.cli", "observe", "--config", "configs/observer.yaml"]
    environment: *trader-environment
    volumes: *trader-volumes
    healthcheck:
      test: ["CMD", "python", "-m", "adaptive_trader.cli", "status", "--config", "configs/observer.yaml"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

  dashboard:
    image: adaptive-portfolio-agent:local
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m
    stop_grace_period: 20s
    restart: unless-stopped
    command:
      - python
      - -m
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      APA_DASHBOARD_CONFIG: configs/observer.yaml
    ports:
      - "8501:8501"
    volumes:
      - apa-runtime:/app/runtime:ro
      - apa-outputs:/app/outputs:ro
      - ./configs:/app/configs:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  paper-trader:
    profiles: ["paper"]
    image: adaptive-portfolio-agent:local
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m
    stop_grace_period: 45s
    restart: "no"
    command: ["python", "-m", "adaptive_trader.cli", "paper-run", "--config", "configs/paper.yaml"]
    environment: *trader-environment
    volumes: *trader-volumes
    healthcheck:
      test: ["CMD", "python", "-m", "adaptive_trader.cli", "status", "--config", "configs/paper.yaml"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

volumes:
  apa-runtime:
  apa-outputs:
  apa-data-cache:
