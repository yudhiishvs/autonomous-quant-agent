name: Offline demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APCA_API_BASE_URL: ""
  APCA_API_KEY_ID: ""
  APCA_API_SECRET_KEY: ""
  ALPACA_API_KEY: ""
  ALPACA_SECRET_KEY: ""
  APA_ALPACA_PAPER_API_KEY: ""
  APA_ALPACA_PAPER_SECRET_KEY: ""
  APA_ALPACA_DATA_API_KEY: ""
  APA_ALPACA_DATA_SECRET_KEY: ""
  APA_MARKET_DATA_DATABASE_URL: ""
  APA_MARKET_DATA_MIGRATION_DATABASE_URL: ""
  APA_ENABLE_PAPER_ORDERS: "NO"
  AQA_ALPACA_DATA_API_KEY_FILE: ""
  AQA_ALPACA_DATA_SECRET_KEY_FILE: ""
  AQA_ALPACA_PAPER_API_KEY_FILE: ""
  AQA_ALPACA_PAPER_SECRET_KEY_FILE: ""
  AQA_PAPER_ACCOUNT_ID_HASH_FILE: ""
  AQA_OPERATOR_TOKEN_FILE: ""
  AQA_DATABASE_URL_FILE: ""
  AQA_ENABLE_PAPER_ORDERS: "NO"

jobs:
  offline-demo:
    name: Deterministic credential-free vertical slice
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Verify demo rejects external network access
        run: uv run --no-sync pytest -q tests/unit/test_platform_demo.py

      - name: Run deterministic demo twice
        shell: bash
        run: |
          mkdir -p evidence
          uv run --no-sync python scripts/verify_no_network.py \
            adaptive_trader.platform.cli demo \
            --config-root "${GITHUB_WORKSPACE}/configs" \
            --output evidence/demo-first.json --json
          uv run --no-sync python scripts/verify_no_network.py \
            adaptive_trader.platform.cli demo \
            --config-root "${GITHUB_WORKSPACE}/configs" \
            --output evidence/demo-second.json --json

      - name: Compare safe logical evidence
        run: >-
          uv run --no-sync python -c
          'import json; from pathlib import Path;
          first = Path("evidence/demo-first.json").read_bytes();
          second = Path("evidence/demo-second.json").read_bytes();
          assert first == second;
          payload = json.loads(first);
          assert payload["evidence_label"] == "OFFLINE_FIXTURE_NOT_ALPACA_EVIDENCE";
          assert payload["schema"] == "offline-demo-evidence-v1";
          assert isinstance(payload["evidence_manifest_hash"], str)
          and len(payload["evidence_manifest_hash"]) == 64'

      - name: Upload safe fixture evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-demo-${{ github.run_id }}
          path: |
            evidence/demo-first.json
            evidence/demo-second.json
          if-no-files-found: error
          retention-days: 14
