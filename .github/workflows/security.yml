name: Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APCA_API_BASE_URL: ""
  APCA_API_KEY_ID: ""
  APCA_API_SECRET_KEY: ""
  ALPACA_API_KEY: ""
  ALPACA_SECRET_KEY: ""
  APA_ALPACA_PAPER_API_KEY: ""
  APA_ALPACA_PAPER_SECRET_KEY: ""
  APA_ALPACA_DATA_API_KEY: ""
  APA_ALPACA_DATA_SECRET_KEY: ""
  APA_MARKET_DATA_DATABASE_URL: ""
  APA_MARKET_DATA_MIGRATION_DATABASE_URL: ""
  APA_ENABLE_PAPER_ORDERS: "NO"
  AQA_ALPACA_DATA_API_KEY_FILE: ""
  AQA_ALPACA_DATA_SECRET_KEY_FILE: ""
  AQA_ALPACA_PAPER_API_KEY_FILE: ""
  AQA_ALPACA_PAPER_SECRET_KEY_FILE: ""
  AQA_PAPER_ACCOUNT_ID_HASH_FILE: ""
  AQA_OPERATOR_TOKEN_FILE: ""
  AQA_DATABASE_URL_FILE: ""
  AQA_ENABLE_PAPER_ORDERS: "NO"

jobs:
  security:
    name: Secrets dependencies and static security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out complete history without persisted credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked application and security tools
        run: uv sync --locked --all-extras --group security

      - name: Run pinned pre-commit hooks
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

      - name: Export the locked Python environment
        run: >-
          uv export --locked --all-extras --group security --no-emit-project
          --no-editable --format requirements-txt
          --output-file "${RUNNER_TEMP}/locked-requirements.txt"

      - name: Audit the locked Python environment
        run: >-
          uv run --no-sync pip-audit
          --requirement "${RUNNER_TEMP}/locked-requirements.txt"
          --require-hashes --disable-pip --progress-spinner=off
          --cache-dir "${RUNNER_TEMP}/pip-audit"

      - name: Scan runtime Python for high-confidence security defects
        run: >-
          uv run --no-sync bandit -c pyproject.toml
          -r src docker -ll -ii

      - name: Verify architecture and repository security contracts
        run: uv run --no-sync pytest -q tests/architecture tests/safety

      - name: Verify authentication and secret redaction sentinels
        run: >-
          uv run --no-sync pytest -q
          tests/safety/test_static_repository_safety.py
          tests/test_offline_environment.py
          tests/test_collection_runtime.py
          tests/unit/test_platform_control_api.py
          tests/unit/test_platform_security.py
