name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    name: Offline quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APA_ALPACA_PAPER_API_KEY: ""
      APA_ALPACA_PAPER_SECRET_KEY: ""
      APA_ENABLE_PAPER_ORDERS: "NO"

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify broker-independent environment
        shell: bash
        run: |
          test -z "${APA_ALPACA_PAPER_API_KEY}"
          test -z "${APA_ALPACA_PAPER_SECRET_KEY}"
          test "${APA_ENABLE_PAPER_ORDERS}" = "NO"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra dashboard

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Run linting
        run: uv run --no-sync ruff check .

      - name: Run type checking
        run: uv run --no-sync mypy src

      - name: Run offline test suite
        run: uv run --no-sync pytest -q

      - name: Run synthetic backtest
        run: >-
          uv run --no-sync python -m adaptive_trader.cli backtest
          --config configs/backtest.yaml --synthetic

      - name: Run deterministic replay
        run: >-
          uv run --no-sync python -m adaptive_trader.cli replay
          --config configs/replay.yaml

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet
