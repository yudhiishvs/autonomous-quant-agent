name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    name: Offline quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: collector_test
          POSTGRES_PASSWORD: collector_test
          POSTGRES_DB: collector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_test -d collector_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APA_ALPACA_PAPER_API_KEY: ""
      APA_ALPACA_PAPER_SECRET_KEY: ""
      APA_ALPACA_DATA_API_KEY: ""
      APA_ALPACA_DATA_SECRET_KEY: ""
      APA_ENABLE_PAPER_ORDERS: "NO"
      APA_MARKET_DATA_DATABASE_URL: >-
        postgresql+psycopg://collector_test:collector_test@127.0.0.1:5432/collector_test
      APA_MARKET_DATA_MIGRATION_DATABASE_URL: >-
        postgresql+psycopg://collector_test:collector_test@127.0.0.1:5432/collector_test
      APA_TEST_POSTGRES_URL: >-
        postgresql+psycopg://collector_test:collector_test@127.0.0.1:5432/collector_test
      APA_TEST_POSTGRES_ALLOW_DESTRUCTIVE: "YES"

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify broker-independent environment
        shell: bash
        run: |
          test -z "${APA_ALPACA_PAPER_API_KEY}"
          test -z "${APA_ALPACA_PAPER_SECRET_KEY}"
          test -z "${APA_ALPACA_DATA_API_KEY}"
          test -z "${APA_ALPACA_DATA_SECRET_KEY}"
          test "${APA_ENABLE_PAPER_ORDERS}" = "NO"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra dashboard

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Run linting
        run: uv run --no-sync ruff check .

      - name: Run type checking
        run: uv run --no-sync mypy src

      - name: Verify PostgreSQL server major version
        shell: bash
        run: |
          actual_major="$(
            docker exec "${{ job.services.postgres.id }}" \
              psql --username=collector_test --dbname=collector_test \
              --tuples-only --no-align \
              --command="SELECT current_setting('server_version_num')::integer / 10000"
          )"
          test "${actual_major}" = "16"

      - name: Validate PostgreSQL migrations
        run: uv run --no-sync alembic upgrade head

      - name: Run offline test suite
        run: uv run --no-sync pytest -q

      - name: Run synthetic backtest
        run: >-
          uv run --no-sync python -m adaptive_trader.cli backtest
          --config configs/backtest.yaml --synthetic

      - name: Run deterministic replay
        run: >-
          uv run --no-sync python -m adaptive_trader.cli replay
          --config configs/replay.yaml

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

      - name: Build locked application image
        run: docker build --target application --tag adaptive-portfolio-agent:ci .

      - name: Build locked market-data image
        run: docker build --target market-data --tag adaptive-market-data:ci .

      - name: Verify collector image entry point
        run: >-
          docker run --rm --network none
          adaptive-market-data:ci python -m adaptive_trader.collection --help

      - name: Verify collector import boundary
        run: >-
          docker run --rm --network none --entrypoint python
          adaptive-market-data:ci -c
          'import importlib.util, sys; import adaptive_trader.collection.cli;
          assert importlib.util.find_spec("alpaca") is None;
          assert importlib.util.find_spec("adaptive_trader.cli") is None;
          assert not any(name == "alpaca" or name.startswith("alpaca.") for name in sys.modules)'
