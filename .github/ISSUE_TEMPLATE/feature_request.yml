name: Feature request
description: Propose a focused, safety-preserving improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete user or engineering problem, not only a proposed solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State observable behavior and how it can be verified offline.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Trust and safety boundaries
      description: Identify data, credentials, persistence, network, or order authority affected.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal does not add or enable real-money execution.
          required: true
        - label: This proposal does not claim profitability or investment performance.
          required: true
