[project]
name = "aqa-public"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "authlib>=1.8,<2",
  "joserfc>=1.6,<2",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "cryptography>=50,<51",
  "fastapi>=0.116,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "requests>=2.32,<3",
  "uvicorn>=0.35,<1",
]
[dependency-groups]
dev = [
    "pytest>=9,<10",
    "httpx>=0.28,<1",
    "ruff>=0.16,<1",
    "mypy>=2,<3",
    "types-requests",
    "pip-audit>=2.9,<3",
    "bandit>=1.9,<2",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/aqa_public"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true
