[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-quant-agent"
version = "0.1.0"
description = "Self-hosted, paper-only quantitative trading platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "alpaca-py>=0.42,<1",
    "defusedxml>=0.7,<1",
    "exchange-calendars>=4.11,<5",
    "fastapi>=0.116,<1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "plotly>=5.24",
    "prometheus-client>=0.21,<1",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.32,<3",
    "rich>=13.8",
    "scipy>=1.11",
    "SQLAlchemy>=2.0",
    "tenacity>=9.0",
    "typer>=0.12",
    "uvicorn>=0.35,<1",
    "websockets>=15,<18",
]

[project.optional-dependencies]
dashboard = [
    "gitpython>=3.1.59,<4",
    "streamlit>=1.36",
]
legacy-yahoo = ["yfinance>=0.2.40"]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[dependency-groups]
execution-runtime = [
    "pydantic>=2.9",
    "PyYAML>=6.0",
]
market-data-runtime = [
    "alembic>=1.16,<2",
    "exchange-calendars>=4.11,<5",
    "numpy>=1.26",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=17",
    "PyYAML>=6.0",
    "requests>=2.32,<3",
    "SQLAlchemy>=2.0",
    "typer>=0.12",
    "websockets>=15,<18",
]
security = [
    "bandit[toml]>=1.8,<2",
    "cyclonedx-bom>=7,<8",
    "detect-secrets>=1.5,<2",
    "pip-audit>=2.9,<3",
    "pre-commit>=4,<5",
]

[project.scripts]
adaptive-portfolio-agent = "adaptive_trader.cli:main"
adaptive-market-data = "adaptive_trader.collection.cli:main"
aqa = "adaptive_trader.platform.cli:main"
autonomous-quant-agent = "adaptive_trader.platform.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: offline integration tests",
    "postgres: tests requiring a caller-provided PostgreSQL database",
    "safety: repository and execution safety checks",
]

[tool.coverage.run]
branch = true
source = ["adaptive_trader"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
exclude_dirs = ["tests"]
