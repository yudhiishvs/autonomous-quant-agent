[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-portfolio-agent"
version = "0.1.0"
description = "Educational, paper-only regime-aware portfolio research prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.42,<1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "plotly>=5.24",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "rich>=13.8",
    "scipy>=1.11",
    "SQLAlchemy>=2.0",
    "tenacity>=9.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36"]
legacy-yahoo = ["yfinance>=0.2.40"]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
adaptive-portfolio-agent = "adaptive_trader.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: offline integration tests",
    "safety: repository and execution safety checks",
]

[tool.coverage.run]
branch = true
source = ["adaptive_trader"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
# NumPy 2.5's installed stubs use Python 3.12+ type-alias syntax. Runtime
# compatibility remains Python 3.11 and is enforced by Ruff's py311 target.
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
